<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .actor { fill: #dceaf7; stroke: #1f4e79; stroke-width: 2; }
    .box { fill: #f8fbff; stroke: #1f4e79; stroke-width: 2; }
    .life { stroke: #8493a3; stroke-width: 2; stroke-dasharray: 7 6; }
    .call { stroke: #1f4e79; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .return { stroke: #526275; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow2); }
    .label { font-size: 16px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#1f4e79"/></marker>
    <marker id="arrow2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#526275"/></marker>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="title">Диаграмма последовательности добавления записи</text>

  <g><rect x="60" y="75" width="190" height="58" rx="5" class="actor"/><text x="155" y="110" text-anchor="middle" class="label">Администратор</text></g>
  <g><rect x="365" y="75" width="190" height="58" rx="5" class="box"/><text x="460" y="110" text-anchor="middle" class="label">Приложение</text></g>
  <g><rect x="670" y="75" width="190" height="58" rx="5" class="box"/><text x="765" y="110" text-anchor="middle" class="label">Python модуль</text></g>
  <g><rect x="975" y="75" width="190" height="58" rx="5" class="box"/><text x="1070" y="110" text-anchor="middle" class="label">База HairdresserDB</text></g>
  <line x1="155" y1="133" x2="155" y2="670" class="life"/><line x1="460" y1="133" x2="460" y2="670" class="life"/><line x1="765" y1="133" x2="765" y2="670" class="life"/><line x1="1070" y1="133" x2="1070" y2="670" class="life"/>

  <line x1="155" y1="190" x2="460" y2="190" class="call"/><text x="305" y="180" text-anchor="middle" class="label">Открывает «Добавить»</text>
  <line x1="460" y1="270" x2="155" y2="270" class="return"/><text x="305" y="260" text-anchor="middle" class="label">Показывает форму записи</text>
  <line x1="155" y1="350" x2="460" y2="350" class="call"/><text x="305" y="340" text-anchor="middle" class="label">Вводит дату, время и коды</text>
  <line x1="460" y1="430" x2="765" y2="430" class="call"/><text x="610" y="420" text-anchor="middle" class="label">Передаёт данные</text>
  <line x1="765" y1="510" x2="1070" y2="510" class="call"/><text x="917" y="500" text-anchor="middle" class="label">INSERT INTO Schedule</text>
  <line x1="1070" y1="570" x2="765" y2="570" class="return"/><text x="917" y="560" text-anchor="middle" class="label">Запись сохранена</text>
  <line x1="765" y1="625" x2="460" y2="625" class="return"/><line x1="460" y1="655" x2="155" y2="655" class="return"/>
  <text x="305" y="645" text-anchor="middle" class="label">Обновляет список записей</text>
</svg>
